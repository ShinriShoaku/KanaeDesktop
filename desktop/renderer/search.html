<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cari Musik - YTPlayer</title>
<style>
  :root {
    --accent: #f97316; --accent2: #a855f7; --bg: #0e0e14; --panel: #17171f; --panel2: #1e1e28;
    --border: #2a2a36; --text: #eceef2; --text-dim: #8b8d9a; --danger: #ef4444; --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; user-select: none; }
  #app { display: flex; flex-direction: column; height: 100vh; }

  #titlebar { -webkit-app-region: drag; display: flex; align-items: center; justify-content: space-between;
    height: 34px; padding: 0 8px 0 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #titlebar .brand { font-weight: 600; color: var(--text-dim); font-size: 12px; display:flex; align-items:center; gap:6px; }
  #titlebar .win-btns { -webkit-app-region: no-drag; display: flex; gap: 2px; }
  #titlebar button { -webkit-app-region: no-drag; width: 26px; height: 26px; border: none; background: transparent;
    color: var(--text-dim); cursor: pointer; border-radius: 5px; font-size: 13px; display:flex; align-items:center; justify-content:center; }
  #titlebar button:hover { background: var(--panel2); color: var(--text); }
  #titlebar button.close:hover { background: var(--danger); color: #fff; }

  #search-bar { display: flex; gap: 6px; padding: 12px 14px; flex-shrink: 0; }
  #search-input { flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 9px 11px; font-size: 13px; outline: none; }
  #search-input:focus { border-color: var(--accent); }
  #search-btn { background: var(--accent); border: none; color: #fff; border-radius: 7px; padding: 0 16px; cursor: pointer; font-size: 12.5px; font-weight: 600; }
  #search-btn:hover { background: #ea6c0c; }
  #search-btn:disabled { opacity: .6; cursor: default; }

  #results { flex: 1; overflow-y: auto; padding: 0 14px 14px; }
  .result-item { display: flex; gap: 10px; padding: 8px 6px; border-radius: 8px; cursor: pointer; align-items: center; }
  .result-item:hover { background: var(--panel2); }
  .result-item img { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--panel2); }
  .result-item .meta { min-width: 0; flex: 1; }
  .result-item .t { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-item .c { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .result-item .add-hint { font-size: 10.5px; color: var(--accent); flex-shrink: 0; opacity: 0; transition: opacity .15s; }
  .result-item:hover .add-hint { opacity: 1; }

  #hint { color: var(--text-dim); font-size: 12px; text-align: center; padding: 30px 20px; line-height: 1.6; }
  #toast { position: fixed; bottom: 14px; left: 14px; right: 14px; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; font-size: 12px; text-align: center; opacity: 0; transform: translateY(6px);
    transition: opacity .2s, transform .2s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.ok { color: var(--ok); border-color: var(--ok); }
  #toast.err { color: var(--danger); border-color: var(--danger); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="brand">&#128269; Cari Musik</div>
    <div class="win-btns">
      <button id="btn-min" title="Minimize">&#8211;</button>
      <button class="close" id="btn-close" title="Tutup">&#10005;</button>
    </div>
  </div>

  <div id="search-bar">
    <input id="search-input" type="text" placeholder="Cari lagu di YouTube…" autofocus />
    <button id="search-btn">Cari</button>
  </div>

  <div id="results">
    <div id="hint">Ketik judul lagu / artis lalu tekan Enter.<br>Klik hasil untuk menambahkan ke antrian.</div>
  </div>

  <div id="toast"></div>
</div>

<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const API = (window.desktop && await window.desktop.getApiBase()) ||
    (params.get("port") ? `http://localhost:${params.get("port")}` : "http://localhost:8000");

  const $ = (id) => document.getElementById(id);
  const escHtml = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function api(path, opts) {
    const res = await fetch(API + path, { headers: opts && opts.body ? { "Content-Type": "application/json" } : undefined, ...opts });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  $("btn-min").onclick = () => window.desktop && window.desktop.minimize();
  $("btn-close").onclick = () => window.desktop && window.desktop.close();

  let toastTimeout = null;
  function showToast(msg, ok) {
    const el = $("toast");
    el.textContent = msg;
    el.className = "show " + (ok ? "ok" : "err");
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => el.classList.remove("show"), 2500);
  }

  async function doSearch() {
    const q = $("search-input").value.trim();
    if (!q) return;
    const box = $("results");
    const btn = $("search-btn");
    btn.disabled = true;
    box.innerHTML = '<div id="hint">Mencari…</div>';
    try {
      const res = await api(`/search?q=${encodeURIComponent(q)}&limit=12`);
      if (!res.results || !res.results.length) {
        box.innerHTML = '<div id="hint">Tidak ditemukan hasil untuk itu.</div>';
        return;
      }
      box.innerHTML = res.results.map((r) => `
        <div class="result-item" data-url="${escHtml(r.url)}">
          <img src="${escHtml(r.thumbnail || "")}" />
          <div class="meta">
            <div class="t">${escHtml(r.title)}</div>
            <div class="c">${escHtml(r.channel || "")}</div>
          </div>
          <span class="add-hint">+ Tambah</span>
        </div>`).join("");
      box.querySelectorAll(".result-item").forEach((el) => {
        el.onclick = async () => {
          try {
            await api("/queue/add", { method: "POST", body: JSON.stringify({ youtube_url: el.dataset.url }) });
            showToast("✓ Ditambahkan ke antrian", true);
          } catch (e) { showToast("Gagal menambahkan: " + e.message, false); }
        };
      });
    } catch (e) {
      box.innerHTML = `<div id="hint">Gagal mencari: ${escHtml(e.message)}</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  $("search-btn").onclick = doSearch;
  $("search-input").onkeydown = (e) => { if (e.key === "Enter") doSearch(); };
  $("search-input").focus();
})();
</script>
</body>
</html>
