<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>TikTok Live - YTPlayer</title>
<style>
  :root {
    --accent: #f97316; --accent2: #a855f7; --bg: #0e0e14; --panel: #17171f; --panel2: #1e1e28;
    --border: #2a2a36; --text: #eceef2; --text-dim: #8b8d9a; --danger: #ef4444; --ok: #22c55e; --gift: #eab308;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; user-select: none; }
  #app { display: flex; flex-direction: column; height: 100vh; }

  #titlebar { -webkit-app-region: drag; display: flex; align-items: center; justify-content: space-between;
    height: 34px; padding: 0 8px 0 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #titlebar .brand { font-weight: 600; color: var(--text-dim); font-size: 12px; display:flex; align-items:center; gap:6px; }
  #titlebar .win-btns { -webkit-app-region: no-drag; display: flex; gap: 2px; }
  #titlebar button { -webkit-app-region: no-drag; width: 26px; height: 26px; border: none; background: transparent;
    color: var(--text-dim); cursor: pointer; border-radius: 5px; font-size: 13px; display:flex; align-items:center; justify-content:center; }
  #titlebar button:hover { background: var(--panel2); color: var(--text); }
  #titlebar button.close:hover { background: var(--danger); color: #fff; }

  #status-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
  #status-bar .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); flex-shrink: 0; }
  .dot.connected { background: var(--ok); box-shadow: 0 0 6px #22c55e88; }
  #uname { font-size: 12.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tt-toggle { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 12px; font-size: 11.5px; cursor: pointer; flex-shrink: 0; }
  #tt-toggle:hover { border-color: var(--accent); }
  #skipvote-row { padding: 0 14px 8px; font-size: 11px; color: var(--text-dim); flex-shrink: 0; }

  #tabs { display: flex; gap: 4px; padding: 8px 14px 0; flex-shrink: 0; }
  #tabs button { flex: 1; background: var(--panel2); border: 1px solid transparent; color: var(--text-dim);
    padding: 6px 0; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: 600; }
  #tabs button.active { color: var(--text); border-color: var(--accent); background: rgba(249,115,22,0.12); }

  #panels { flex: 1; overflow-y: auto; padding: 8px 14px 16px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .chat-item { display: flex; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--border); font-size: 12px; align-items: flex-start; }
  .chat-item .u { color: var(--accent2); font-weight: 600; flex-shrink: 0; }
  .chat-item .txt { color: var(--text); word-break: break-word; }
  .chat-item.gift .txt { color: var(--gift); }
  .chat-item.like .txt, .chat-item.follow .txt { color: var(--text-dim); font-style: italic; }

  .req-item { padding: 7px 4px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .req-item .u { color: var(--accent2); font-weight: 600; }
  .req-item .txt { color: var(--text-dim); }
  .req-item .status { float: right; font-size: 10px; padding: 1px 6px; border-radius: 4px; }
  .req-item .status.searching { background: rgba(249,115,22,.18); color: var(--accent); }
  .req-item .status.added { background: rgba(34,197,94,.18); color: var(--ok); }
  .req-item .status.not_found, .req-item .status.error { background: rgba(239,68,68,.18); color: var(--danger); }

  #empty { color: var(--text-dim); font-size: 12px; text-align: center; padding: 24px 0; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="brand"><span class="dot" id="dot-title"></span> TikTok Live</div>
    <div class="win-btns">
      <button id="btn-min" title="Minimize">&#8211;</button>
      <button class="close" id="btn-close" title="Tutup">&#10005;</button>
    </div>
  </div>

  <div id="status-bar">
    <div class="left"><span class="dot" id="dot-status"></span><span id="uname">Belum terhubung</span></div>
    <button id="tt-toggle">Connect</button>
  </div>
  <div id="skipvote-row">Skip vote: <span id="skipvote">0/-</span></div>

  <div id="tabs">
    <button class="active" data-tab="chat">Live Chat</button>
    <button data-tab="requests">Requests</button>
  </div>

  <div id="panels">
    <div class="panel active" id="panel-chat">
      <div id="chat-list"><div id="empty">Belum ada aktivitas chat</div></div>
    </div>
    <div class="panel" id="panel-requests">
      <div id="req-list"><div id="empty2">Belum ada request</div></div>
    </div>
  </div>
</div>

<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const API = (window.desktop && await window.desktop.getApiBase()) ||
    (params.get("port") ? `http://localhost:${params.get("port")}` : "http://localhost:8000");

  const $ = (id) => document.getElementById(id);
  const escHtml = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function api(path, opts) {
    try {
      const res = await fetch(API + path, { headers: opts && opts.body ? { "Content-Type": "application/json" } : undefined, ...opts });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) { return null; }
  }

  $("btn-min").onclick = () => window.desktop && window.desktop.minimize();
  $("btn-close").onclick = () => window.desktop && window.desktop.close();

  document.querySelectorAll("#tabs button").forEach((btn) => {
    btn.onclick = () => {
      document.querySelectorAll("#tabs button").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      $(`panel-${btn.dataset.tab}`).classList.add("active");
    };
  });

  // ── Status polling ───────────────────────
  async function refreshStatus() {
    const st = await api("/tiktok/status");
    if (!st) return;
    $("dot-title").classList.toggle("connected", !!st.connected);
    $("dot-status").classList.toggle("connected", !!st.connected);
    $("uname").textContent = st.connected ? `@${st.username || "?"} - live` : (st.username ? `@${st.username} - terputus` : "Belum diatur (isi di Settings)");
    $("tt-toggle").textContent = st.connected ? "Disconnect" : "Connect";
    $("skipvote").textContent = `${st.skip_votes || 0}/${st.skip_threshold || "-"}`;
    renderRequests(st.recent_requests || []);
  }
  $("tt-toggle").onclick = async () => {
    const st = await api("/tiktok/status");
    if (st && st.connected) await api("/tiktok/disconnect", { method: "POST" });
    else await api("/tiktok/reconnect", { method: "POST" });
    refreshStatus();
  };

  function renderRequests(reqs) {
    const box = $("req-list");
    if (!reqs.length) { box.innerHTML = '<div id="empty2">Belum ada request</div>'; return; }
    box.innerHTML = reqs.map((r) => {
      const label = r.type === "skip" ? "vote skip" : escHtml(r.text || r.song_title || "");
      const status = r.status ? `<span class="status ${escHtml(r.status)}">${escHtml(r.status)}</span>` : "";
      return `<div class="req-item">${status}<span class="u">${escHtml(r.user)}</span> <span class="txt">${label}</span></div>`;
    }).join("");
  }

  // ── Live chat feed via SSE (chat / gift / like / follow) ─
  const MAX_CHAT = 100;
  let chatItems = [];
  function pushChat(html) {
    chatItems.push(html);
    if (chatItems.length > MAX_CHAT) chatItems = chatItems.slice(-MAX_CHAT);
    const box = $("chat-list");
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    box.innerHTML = chatItems.join("");
    if (atBottom) box.scrollTop = box.scrollHeight;
  }

  function connectSSE() {
    let es;
    try { es = new EventSource(`${API}/overlay/events`); } catch (e) { return; }

    es.addEventListener("tiktok_chat", (ev) => {
      try {
        const d = JSON.parse(ev.data);
        let cls = "chat", txt = "";
        if (d.type === "gift") { cls = "gift"; txt = `mengirim gift ${escHtml(d.gift_name || d.detail || "")} x${d.repeat_count || 1}`; }
        else if (d.type === "like") { cls = "like"; txt = `menyukai stream (${d.like_count || ""})`; }
        else if (d.type === "follow") { cls = "follow"; txt = "mengikuti akun"; }
        else { txt = escHtml(d.comment || d.text || ""); }
        pushChat(`<div class="chat-item ${cls}"><span class="u">${escHtml(d.user || d.nickname || "?")}</span><span class="txt">${txt}</span></div>`);
      } catch (e) {}
    });
    es.addEventListener("tiktok_request", (ev) => { refreshStatus(); });
    es.addEventListener("skip_vote", (ev) => { refreshStatus(); });
    es.addEventListener("tiktok_status", (ev) => { refreshStatus(); });
    es.onerror = () => { /* auto-retries by default */ };
  }

  refreshStatus();
  connectSSE();
  setInterval(refreshStatus, 4000);
})();
</script>
</body>
</html>
